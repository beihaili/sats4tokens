# Demo stack for the bitcoin++ Berlin hackathon: a private copy of the relay (same image, same
# channels) whose only payment method is the cashu-epay Bitcoin gateway.
#
# Fully isolated from production (/opt/new-api-relay): own compose project, own network,
# own MySQL, no Redis, own ports. Nothing here references a production container.
#
#   :8530  new-api demo   (http://<server-ip>:8530)
#   :8531  cashu-epay     (http://<server-ip>:8531) — new-api's EPay "PayAddress"
#
# Secrets live in .env (mode 0600, generated by bootstrap.sh). data/ holds the gateway seed and
# ecash proofs — bearer money, never copy it anywhere public.
name: cashu-epay-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: cashu-demo-mysql
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "newapi"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  new-api:
    image: "${NEW_API_IMAGE}" # the exact image production runs
    pull_policy: never
    container_name: cashu-demo-newapi
    restart: unless-stopped
    logging: *default-logging
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:8530:3000" # public access is https via tunnel-shop; ssh -L for root
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    environment:
      SQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local"
      SESSION_SECRET: "${SESSION_SECRET}"
      CRYPTO_SECRET: "${CRYPTO_SECRET}"
      TZ: "Asia/Shanghai"
      NODE_NAME: "cashu-epay-demo"
      SESSION_COOKIE_SECURE: "false" # plain http on :8530
      ERROR_LOG_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  gateway:
    build: ./gateway
    image: cashu-epay:demo
    container_name: cashu-demo-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8531:8090" # public access is https via tunnel-pay
    volumes:
      - ./data/${GATEWAY_DATA:-gateway}:/data # gateway = testnut wallet, gateway-mainnet = real mint (switch-mint.sh)
      - ./public:/public:ro # upstreams.json from export-upstreams.sh (anonymized, no hosts)
    environment:
      EPAY_PID: "1001"
      EPAY_KEY: "${EPAY_KEY}"
      ADMIN_KEY: "${ADMIN_KEY}" # operator page key; not EPAY_KEY, which can sign "paid" notifies
      MINT_URL: "${MINT_URL:-https://testnut.cashu.space}"
      FIAT: "${FIAT:-usd}" # new-api money = top-up amount × Price; Price=1 → money is USD
      ORDER_TTL_MIN: "30"
      CHECKOUT_TAB: "${CHECKOUT_TAB:-cashu}" # testnut pays its own invoices, so don't open on ⚡ (switch-mint.sh sets ln for a real mint)
      # admin page shows the withdrawn token so it can be copied; fine for testnut, set 0 for a real mint on plain http
      WITHDRAW_TOKEN_OVER_HTTP: "${WITHDRAW_TOKEN_OVER_HTTP:-1}"
      TZ: "Europe/Berlin"
      # key shop (/ on the pay URL): pay → get a new-api key capped at what was paid, no signup.
      # Keys belong to the demo pool user "keyshop"; NEWAPI_TOKEN is that user's access token (user-level only).
      NEWAPI_URL: "http://new-api:3000"
      NEWAPI_USER_ID: "${NEWAPI_USER_ID:-}"
      NEWAPI_TOKEN: "${NEWAPI_TOKEN:-}"
      # endpoint shown with a sold key; set when the named tunnel below is on (e.g. https://<domain>/v1)
      KEY_BASE_URL: "${KEY_BASE_URL:-}"
      # /network page: anonymized upstream routing table (re-read when the file changes)
      UPSTREAMS_FILE: "/public/upstreams.json"
      # Node's happy-eyeballs gives each connect attempt 250ms; Minibits is ~265ms RTT from this VPS → ETIMEDOUT
      NODE_OPTIONS: "--network-family-autoselection-attempt-timeout=2000"
    networks: [demo]

  # HTTPS without touching the production Caddy (its admin is off, a change means restarting it for
  # all relay users): Cloudflare quick tunnels, outbound only. Random *.trycloudflare.com URL per start;
  # https-tunnel.sh reads them and points new-api's ServerAddress/PayAddress at them.
  tunnel-shop:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cashu-demo-tunnel-shop
    command: tunnel --no-autoupdate --url http://new-api:3000
    restart: unless-stopped
    networks: [demo]
  tunnel-pay:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cashu-demo-tunnel-pay
    command: tunnel --no-autoupdate --url http://gateway:8090
    restart: unless-stopped
    networks: [demo]
  # Optional stable URL: a Cloudflare *named* tunnel on your own domain (still outbound only, no open port,
  # server IP stays out of DNS). Opt in with COMPOSE_PROFILES=named-tunnel in .env. Needs, server-only:
  #   secrets/cloudflared/credentials.json  from `cloudflared tunnel create <name>` (owned by uid 65532)
  #   secrets/cloudflared/config.yml        tunnel id + ingress: ^/v1/ → http://new-api:3000, rest → http://gateway:8090
  # The quick tunnels above stay: new-api's ServerAddress/PayAddress (top-up callbacks) still point at them.
  tunnel-named:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cashu-demo-tunnel-named
    profiles: [named-tunnel]
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./secrets/cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    networks: [demo]

networks:
  demo:
    name: cashu-epay-demo
