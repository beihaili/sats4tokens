# Demo stack for the bitcoin++ Berlin hackathon: a private copy of the relay (same image, same
# channels) whose only payment method is the cashu-epay Bitcoin gateway.
#
# Fully isolated from production (/opt/new-api-relay): own compose project, own network,
# own MySQL, no Redis, own ports. Nothing here references a production container.
#
#   :8530  new-api demo   (http://<server-ip>:8530)
#   :8531  cashu-epay     (http://<server-ip>:8531) — new-api's EPay "PayAddress"
#
# Secrets live in .env (mode 0600, generated by bootstrap.sh). data/ holds the gateway seed and
# ecash proofs — bearer money, never copy it anywhere public.
name: cashu-epay-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: cashu-demo-mysql
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "newapi"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  new-api:
    image: "${NEW_API_IMAGE}" # the exact image production runs
    pull_policy: never
    container_name: cashu-demo-newapi
    restart: unless-stopped
    logging: *default-logging
    command: --log-dir /app/logs
    ports:
      - "0.0.0.0:8530:3000"
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    environment:
      SQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local"
      SESSION_SECRET: "${SESSION_SECRET}"
      CRYPTO_SECRET: "${CRYPTO_SECRET}"
      TZ: "Asia/Shanghai"
      NODE_NAME: "cashu-epay-demo"
      SESSION_COOKIE_SECURE: "false" # plain http on :8530
      ERROR_LOG_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  gateway:
    build: ./gateway
    image: cashu-epay:demo
    container_name: cashu-demo-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "0.0.0.0:8531:8090"
    volumes:
      - ./data/gateway:/data
    environment:
      EPAY_PID: "1001"
      EPAY_KEY: "${EPAY_KEY}"
      ADMIN_KEY: "${ADMIN_KEY}" # operator page key; not EPAY_KEY, which can sign "paid" notifies
      MINT_URL: "${MINT_URL:-https://testnut.cashu.space}"
      FIAT: "${FIAT:-usd}" # new-api money = top-up amount × Price; Price=1 → money is USD
      ORDER_TTL_MIN: "30"
      CHECKOUT_TAB: "${CHECKOUT_TAB:-cashu}" # testnut pays its own invoices, so don't open on ⚡ (set ln for a real mint)
      # admin page shows the withdrawn token so it can be copied; fine for testnut, set 0 for a real mint on plain http
      WITHDRAW_TOKEN_OVER_HTTP: "${WITHDRAW_TOKEN_OVER_HTTP:-1}"
      TZ: "Europe/Berlin"
    networks: [demo]

networks:
  demo:
    name: cashu-epay-demo
