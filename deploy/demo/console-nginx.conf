# Console host (CONSOLE_URL) → new-api, serving the EU relay's patched frontend (patch-console.py).
# cloudflared sends the console's /v1/ API traffic straight to new-api; everything else comes through here.
# Only HTML is touched (sub_filter: the patched index name from console/patch.conf); API/SSE/WebSocket pass through.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 0;

  # Docker DNS, re-resolved: new-api's IP changes when its container is recreated
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $newapi http://new-api:3000;

  # patched files (new names, so caching them for good is safe)
  location ~ ^/static/js/.+-eur[0-9a-f]+\.js$ {
    root /srv/console;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / {
    proxy_pass $newapi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding ""; # sub_filter needs plain HTML; Cloudflare compresses for the browser
    # cloudflared's X-Forwarded-For / CF-Connecting-IP are passed through unchanged
    proxy_buffering off;                 # streamed chat answers
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /srv/console/patch*.conf;    # none or an empty one = the original frontend
  }
}
